spring:
  application:
    name: WhatsappMessage

  # ── Database ─────────────────────────────────────────────────────────
  datasource:
    url: jdbc:mysql://localhost:3306/aigreentick
    username: root
    password: meenagaming12@#
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000        # 5 minutes
      connection-timeout: 30000   # 30 seconds
      max-lifetime: 1800000       # 30 minutes

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50          # batches N updates into fewer DB round-trips
        order_updates: true       # groups same-table updates together for batching
    show-sql: false

  # ── Kafka ─────────────────────────────────────────────────────────────
  kafka:
    admin:
      auto-create: true
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        batch.size: 65536             # 64KB
        linger.ms: 10
        buffer.memory: 33554432       # 32MB
        compression.type: lz4
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000

    consumer:
      group-id: webhook-status-processor
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 500
      properties:
        max.poll.interval.ms: 300000  # 5 min — generous for backpressure pauses
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000

# ── Kafka Topics ───────────────────────────────────────────────────────
kafka:
  topics:
    # Broadcast dispatch (existing)
    outbound-messages: whatsapp.broadcast.dispatch
    # Webhook status pipeline (new)
    status-inbound: whatsapp.status.inbound
    status-retry-1: whatsapp.status.retry.1
    status-retry-2: whatsapp.status.retry.2
    status-retry-3: whatsapp.status.retry.3
    status-dlq:     whatsapp.status.dlq

# ── Webhook Accumulator & Retry Config ────────────────────────────────
webhook:
  accumulator:
    buffer-capacity: 50000
    pause-threshold-percent: 80   # pause consumer when buffer >= 40,000
    resume-threshold-percent: 50  # resume consumer when buffer <= 25,000
    flush-count: 1000             # flush batch on 1000 events
    flush-interval-ms: 3000       # flush batch every 3 seconds regardless
  retry:
    delays:
      retry-1-ms: 3000
      retry-2-ms: 6000
      retry-3-ms: 12000
    max-retries: 3

# ── Broadcast Batch Config ─────────────────────────────────────────────
broadcast:
  batch-size: 1000

# ═══════════════════════════════════════════════════════════════════════
#  SERVER
# ═══════════════════════════════════════════════════════════════════════
server:
  port: 8080
  shutdown: graceful

# ═══════════════════════════════════════════════════════════════════════
#  LOGGING
# ═══════════════════════════════════════════════════════════════════════
logging:
  level:
    root: INFO
    com.aigrenntick.service.WhatsappMessage: INFO
    com.aigrenntick.service.WhatsappMessage.kafka: INFO
    com.aigrenntick.service.WhatsappMessage.service: INFO
    com.aigrenntick.service.WhatsappMessage.controller: INFO
    org.apache.kafka: WARN
    org.apache.kafka.clients.producer.ProducerConfig: WARN
    org.springframework.kafka: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"